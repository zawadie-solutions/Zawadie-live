[project]
name = "facematch"
version = "0.1.0"
description = "Self-hosted age- and angle-invariant face verification (reference vs. candidates)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: loads the real InsightFace model (slow; skipped if the model is not downloaded)",
]
filterwarnings = ["ignore::FutureWarning"]
